
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Unavailable</title>

    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", sans-serif;
            background: #101114;
            color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        main {
            width: 100%;
            max-width: 480px;
            padding: 40px 32px;
            text-align: center;
            background: #191a20;
            border: 1px solid #30313a;
            border-radius: 16px;
        }

        .icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #292a32;
            color: #a8abb8;
            font-size: 28px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        p {
            margin: 0;
            color: #a4a6b2;
            font-size: 15px;
            line-height: 1.7;
        }

        .reference {
            margin-top: 28px;
            color: #777986;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            main {
                padding: 32px 22px;
            }
        }
    </style>
</head>

<body>
    <main>
        <div class="icon" aria-hidden="true">i</div>

        <h1>Content Unavailable</h1>

        <p>
            The requested content is not available.
            No content will be provided for this request.
        </p>

        <div class="reference">
            The request cannot be fulfilled.
        </div>
    </main>
</body>
</html>

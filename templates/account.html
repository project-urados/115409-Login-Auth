{% extends "base.html" %}
{% block content %}
<h1>Account</h1>
<p>Signed in as <strong>{{ user.display_name }}</strong> (<code>{{ user.username }}</code>).</p>
<section>
  <h2>Change display name</h2>
  <form method="post" action="{{ url_for('update_profile') }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="honeypot" aria-hidden="true"><label>Leave this field empty<input name="website" tabindex="-1" autocomplete="off"></label></div>
    <label for="display_name">Display name</label><input id="display_name" name="display_name" maxlength="60" required value="{{ user.display_name }}">
    <input type="hidden" name="challenge_id" value="{{ profile_challenge.challenge_id }}">
    <label for="profile_answer">Local bot check: {{ profile_challenge.question }}</label><input id="profile_answer" name="challenge_answer" inputmode="numeric" required autocomplete="off">
    <button type="submit">Save display name</button>
  </form>
</section>
<section>
  <h2>Change password</h2>
  <form method="post" action="{{ url_for('change_password') }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="honeypot" aria-hidden="true"><label>Leave this field empty<input name="website" tabindex="-1" autocomplete="off"></label></div>
    <label for="old_password">Current password</label><input id="old_password" name="old_password" type="password" required autocomplete="current-password">
    <label for="new_password">New password (at least 12 characters)</label><input id="new_password" name="new_password" type="password" minlength="12" maxlength="128" required autocomplete="new-password">
    <label for="confirm_password">Confirm new password</label><input id="confirm_password" name="confirm_password" type="password" minlength="12" maxlength="128" required autocomplete="new-password">
    <input type="hidden" name="challenge_id" value="{{ password_challenge.challenge_id }}">
    <label for="password_answer">Local bot check: {{ password_challenge.question }}</label><input id="password_answer" name="challenge_answer" inputmode="numeric" required autocomplete="off">
    <button type="submit">Change password</button>
  </form>
</section>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<div class="card card-narrow">
  <h1>Two-step verification</h1>
  <p class="muted">Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
  {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" autocomplete="off">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="honeypot" aria-hidden="true"><label>Leave this field empty<input name="website" tabindex="-1" autocomplete="off"></label></div>
    <label for="code">Verification code</label>
    <input id="code" name="code" class="code-input" inputmode="text" maxlength="32" required autofocus autocomplete="one-time-code">
    <input type="hidden" name="challenge_id" value="{{ challenge.challenge_id }}">
    <label for="challenge_answer">Local bot check: {{ challenge.question }}</label>
    <input id="challenge_answer" name="challenge_answer" inputmode="numeric" required autocomplete="off">
    <button type="submit" class="btn-block">Verify and sign in</button>
  </form>
</div>
{% endblock %}

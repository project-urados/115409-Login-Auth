{% extends "base.html" %}
{% block content %}
<h1>Sign in</h1>
<p class="muted">Sign in to your local account.</p>
{% if error %}<div class="notice">{{ error }}</div>{% endif %}
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="honeypot" aria-hidden="true"><label>Leave this field empty<input name="website" tabindex="-1" autocomplete="off"></label></div>
  <label for="username">Username</label><input id="username" name="username" maxlength="32" required autocomplete="username">
  <label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password">
  <input type="hidden" name="challenge_id" value="{{ challenge.challenge_id }}">
  <label for="challenge_answer">Local bot check: {{ challenge.question }}</label><input id="challenge_answer" name="challenge_answer" inputmode="numeric" required autocomplete="off">
  <button type="submit">Sign in</button>
</form>
<p><a href="{{ url_for('register') }}">Create an account</a></p>
{% endblock %}

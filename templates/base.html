<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Local Auth Demo</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav>
    <a href="{{ url_for('home') }}">Home</a>
    {% if user %}<a href="{{ url_for('account') }}">Account</a>{% else %}
      <a href="{{ url_for('login') }}">Sign in</a><a href="{{ url_for('register') }}">Create account</a>
    {% endif %}
    {% if user %}
      <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button type="submit">Sign out</button>
      </form>
    {% endif %}
  </nav>
  {% with messages = get_flashed_messages() %}
    {% if messages %}<div class="notice">{% for message in messages %}<div>{{ message }}</div>{% endfor %}</div>{% endif %}
  {% endwith %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
